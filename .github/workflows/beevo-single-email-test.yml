name: Beevo Single Email Delivery Test

on:
  workflow_dispatch:
    inputs:
      message_id:
        description: "Approved Beevo test message ID"
        required: true
        type: string
      confirm_test_email:
        description: "Confirm sending the approved test email"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: beevo-single-email-test
  cancel-in-progress: false

jobs:
  send-single-test-email:
    name: Process One Approved Test Email
    runs-on: ubuntu-latest
    timeout-minutes: 10

    if: >-
      github.event_name == 'workflow_dispatch' &&
      inputs.confirm_test_email == true &&
      inputs.message_id == '1'

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci
      - name: Check database hostname DNS
        run: |
          if [ -z "$DB_HOST" ]; then
            echo "DB_HOST is missing."
            exit 1
          fi
          echo "Checking database hostname DNS..."
          node -e "require('dns').lookup(process.env.DB_HOST, (err, address) => { if (err) { console.error('DNS lookup failed:', err.code); process.exit(1); } console.log('DNS lookup successful.'); })"
        env:
          DB_HOST: ${{ secrets.DB_HOST }}
      - name: Process the approved email only
        run: node src/workers/run-single-follow-up-message.js
        env:
          NODE_ENV: production
          MESSAGE_ID: ${{ inputs.message_id }}

          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_SSL: "true"
          DB_SSL_REJECT_UNAUTHORIZED: "true"

          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_FROM_EMAIL: ${{ secrets.RESEND_FROM_EMAIL }}
