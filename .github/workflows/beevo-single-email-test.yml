name: Beevo Single Email Delivery Test

on:
  workflow_dispatch:
    inputs:
      message_id:
        description: "Approved Beevo test message ID"
        required: true
        type: string
      confirm_test_email:
        description: "Confirm sending the approved test email"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: beevo-single-email-test
  cancel-in-progress: false

jobs:
  send-single-test-email:
    name: Process One Approved Test Email
    runs-on: ubuntu-latest
    timeout-minutes: 10

    if: >-
      github.event_name == 'workflow_dispatch' &&
      inputs.confirm_test_email == true &&
      inputs.message_id == '1'

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Check database hostname DNS
        run: |
          if [ -z "$DB_HOST" ]; then
            echo "DB_HOST is missing."
            exit 1
          fi

          echo "Checking system DNS..."

          node --input-type=module -e '
            import dns from "node:dns";

            dns.lookup(process.env.DB_HOST, (error, address) => {
              if (error) {
                console.error("System DNS lookup failed:", error.code);
                process.exitCode = 1;
                return;
              }

              console.log("System DNS lookup successful.");
              console.log("Resolved IP address:", address);
            });
          '

          echo "Checking public DNS..."

          node --input-type=module -e '
            import https from "node:https";

            const hostname = process.env.DB_HOST;
            const url = "https://dns.google/resolve?name=" +
              encodeURIComponent(hostname) + "&type=A";

            https.get(url, (response) => {
              let data = "";

              response.on("data", (chunk) => data += chunk);

              response.on("end", () => {
                try {
                  const result = JSON.parse(data);
                  console.log("Public DNS status:", result.Status);
                  console.log(
                    "IPv4 records found:",
                    (result.Answer || []).filter(record => record.type === 1).length
                  );
                } catch {
                  console.error("Could not parse public DNS response.");
                  process.exitCode = 1;
                }
              });
            }).on("error", (error) => {
              console.error("Public DNS check failed:", error.code);
              process.exitCode = 1;
            });
          '
        env:
          DB_HOST: ${{ secrets.DB_HOST }}

      - name: Process the approved email only
        run: node src/workers/run-single-follow-up-message.js
        env:
          NODE_ENV: production
          MESSAGE_ID: ${{ inputs.message_id }}

          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_SSL: "true"
          DB_SSL_REJECT_UNAUTHORIZED: "true"

          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_FROM_EMAIL: ${{ secrets.RESEND_FROM_EMAIL }}
