name: Beevo Single Email Delivery Test

on:
  workflow_dispatch:
    inputs:
      message_id:
        description: "Approved Beevo test message ID"
        required: true
        type: string
      confirm_test_email:
        description: "Confirm sending the approved test email"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: beevo-single-email-test
  cancel-in-progress: false

jobs:
  send-single-test-email:
    name: Process One Approved Test Email
    runs-on: ubuntu-latest
    timeout-minutes: 10

    if: >-
      github.event_name == 'workflow_dispatch' &&
      inputs.confirm_test_email == true &&
      inputs.message_id == '1'

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Process the approved email only
        run: node src/workers/run-single-follow-up-message.js
        env:
          NODE_ENV: production
          MESSAGE_ID: ${{ inputs.message_id }}

          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_SSL: "true"
          DB_SSL_REJECT_UNAUTHORIZED: "true"

          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_FROM_EMAIL: ${{ secrets.RESEND_FROM_EMAIL }}
