name: Beevo Production Automation

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      confirm_production_run:
        description: "Confirm that Beevo production automation should run"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: beevo-production-automation
  cancel-in-progress: false

jobs:
  automation:
    name: Process Beevo Automation
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # The repository variable is the master safety switch.
    # Manual runs additionally require explicit confirmation.
    if: >-
      vars.BEEVO_AUTOMATION_ENABLED == 'true' &&
      (
        github.event_name != 'workflow_dispatch' ||
        inputs.confirm_production_run == true
      )

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run Beevo automation cycle
        run: npm run worker:cron
        env:
          NODE_ENV: production

          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_SSL: "true"
          DB_SSL_REJECT_UNAUTHORIZED: "true"

          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_FROM_EMAIL: ${{ secrets.RESEND_FROM_EMAIL }}

          TERMII_API_KEY: ${{ secrets.TERMII_API_KEY }}
          TERMII_SENDER_ID: ${{ secrets.TERMII_SENDER_ID }}
          TERMII_BASE_URL: ${{ secrets.TERMII_BASE_URL }}
          TERMII_SMS_CHANNEL: ${{ secrets.TERMII_SMS_CHANNEL }}

          WHATSAPP_ACCESS_TOKEN: ${{ secrets.WHATSAPP_ACCESS_TOKEN }}
          WHATSAPP_PHONE_NUMBER_ID: ${{ secrets.WHATSAPP_PHONE_NUMBER_ID }}
          WHATSAPP_API_VERSION: ${{ secrets.WHATSAPP_API_VERSION }}

          MESSAGE_BATCH_SIZE: "10"
          RESTOCK_BATCH_SIZE: "10"
